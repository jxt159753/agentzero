<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星光游戏机 · 接口示例</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#142a26;color:#f7edcf;font:16px system-ui;text-align:center}main{padding:28px}h1{font-size:25px;letter-spacing:3px}.reels{display:flex;gap:14px;margin:26px 0}.reels span{display:grid;place-items:center;width:90px;height:110px;background:#f7edcf;color:#bd694e;border-radius:12px;font-size:48px;box-shadow:inset 0 -10px #d6d0b7}button{border:0;border-radius:22px;padding:13px 24px;color:#233b2c;background:#dcba72;font:inherit;cursor:pointer}button:disabled{opacity:.5}p{max-width:390px;line-height:1.7;font-size:13px;color:#bacbc1}</style>
<main><small>AGENTZERO · GAME BRIDGE DEMO</small><h1>星光游戏机</h1><div class="reels"><span>★</span><span>◆</span><span>✿</span></div><button id="spin">转动一次</button><p id="notice">正在等待游戏机连接。预览可以试玩，不扣积分。</p><p>这是浏览器接口示例。三同记 100 分、两同 20 分，其余 5 分；不自动申请平台奖励。</p></main>
<script>
const protocol='agentzero.game.v1', symbols=['★','◆','✿'];let context=null,finished=false;
window.addEventListener('message',event=>{if(event.source!==parent||event.data?.protocol!==protocol)return;const m=event.data;if(m.type==='init'){context=m;document.querySelector('#notice').textContent=m.mode==='play'?'本局已开始，转动后提交分数。':'免费预览 · 不扣积分、不发奖励。';}if(m.type==='result')document.querySelector('#notice').textContent=m.ok?'分数已提交，等待发布者结算。':m.error;});
document.querySelector('#spin').onclick=()=>{if(finished)return;const reels=Array.from({length:3},()=>symbols[Math.floor(Math.random()*symbols.length)]);document.querySelectorAll('.reels span').forEach((el,i)=>el.textContent=reels[i]);const count=new Set(reels).size,score=count===1?'100':count===2?'20':'5';document.querySelector('#notice').textContent='本次分数：'+score;if(context?.mode==='play'){finished=true;document.querySelector('#spin').disabled=true;parent.postMessage({protocol,type:'submit',request_id:'demo-finish',score,reward_requested:'0'},'*');}};
parent.postMessage({protocol,type:'ready',request_id:'demo-ready'},'*');
</script></html>
