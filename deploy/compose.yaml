services:
  db:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      MIGRATION_PASSWORD: ${MIGRATION_PASSWORD:?Set MIGRATION_PASSWORD}
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-agentzero.sh:ro
    healthcheck:
      # The initialization server accepts sockets before setup has finished; wait for final TCP startup.
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, postgres, -d, agentzero]
      interval: 5s
      timeout: 5s
      retries: 12
  migrate:
    build: { context: .., dockerfile: deploy/Dockerfile }
    environment:
      MIGRATION_DATABASE_URL: ${DEPLOY_MIGRATION_DATABASE_URL:?Set DEPLOY_MIGRATION_DATABASE_URL}
    command: [pnpm, db:migrate]
    depends_on: { db: { condition: service_healthy } }
  api:
    build: { context: .., dockerfile: deploy/Dockerfile }
    environment:
      DATABASE_URL: ${DEPLOY_DATABASE_URL:?Set DEPLOY_DATABASE_URL}
      PUBLIC_ORIGIN: https://${PUBLIC_HOST:?Set PUBLIC_HOST}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?Set GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?Set GITHUB_CLIENT_SECRET}
      GITHUB_APP_ID: ${GITHUB_APP_ID:?Set GITHUB_APP_ID}
      GITHUB_PRIVATE_KEY_PATH: /run/secrets/github_app_private_key
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?Set GITHUB_WEBHOOK_SECRET}
      BOOTSTRAP_ADMIN_GITHUB_ID: ${BOOTSTRAP_ADMIN_GITHUB_ID:?Set BOOTSTRAP_ADMIN_GITHUB_ID}
    depends_on: { migrate: { condition: service_completed_successfully } }
    secrets: [github_app_private_key]
    restart: unless-stopped
  proxy:
    image: caddy:2
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api]
    restart: unless-stopped
volumes:
  postgres_data:
  caddy_data:
secrets:
  github_app_private_key:
    file: ${GITHUB_PRIVATE_KEY_FILE:?Set GITHUB_PRIVATE_KEY_FILE}
